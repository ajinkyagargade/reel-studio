# Render Blueprint: deploys only the backend (the frontend lives on Vercel).
# Render dashboard -> New -> Blueprint -> pick this repo. It will ask for the two secret values below.
services:
  - type: web
    name: reel-studio-backend
    runtime: docker
    dockerfilePath: ./reel-studio/backend/Dockerfile
    dockerContext: ./reel-studio/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL, e.g. https://your-app.vercel.app (comma-separate several)
      - key: WHISPER_MODEL
        value: base          # the free plan has little memory; "small" may crash it
      - key: JOB_WORKERS
        value: "1"
